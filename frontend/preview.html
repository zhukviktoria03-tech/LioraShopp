      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderApp() {

                <h4>${escapeHtml(s.value)}</h4>
                <p>${escapeHtml(s.label)}</p>
              </div>

                    <div class="hero-buttons">
                      <a href="${escapeHtml(block.primaryButtonUrl)}" target="_blank" class="btn btn-primary">

                      <a href="${escapeHtml(block.primaryButtonUrl)}" target="_blank" class="btn btn-rose btn-sm">
                        Відкрити Django-магазин →
                      </a>
                    </div>
                  </div>
                </div>

                <div class="footer-django-notice">
                  <strong>Зв'язок із бекендом на Python Django:</strong>
                  <p>${escapeHtml(footer.djangoNotice)}</p>
                  <p style="margin-top: 8px;">
                    <a href="${escapeHtml(header.djangoShopUrl)}" target="_blank">Перейти до каталогу та кошика в Django →</a>
                  </p>
                </div>
              </div>
              <div class="footer-bottom">
                <span>${escapeHtml(footer.copyright)}</span>
                <div class="footer-socials">
                  ${footer.socialLinks.map(s => `<a href="${escapeHtml(s.url)}" target="_blank">${escapeHtml(s.name)}</a>`).join('')}
                </div>
              </div>
            </div>
          </footer>
        `;

        // FAQ accordion click handling
        document.querySelectorAll('.faq-question').forEach(q => {
          q.addEventListener('click', () => {
            const item = q.parentElement;
            const isOpen = item.classList.contains('active');
            document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));
            if (!isOpen) item.classList.add('active');
          });
        });
      }

      function showRoleModal() {
        const modalContainer = document.getElementById('role-modal-container');
        modalContainer.innerHTML = `
          <div class="role-modal-overlay">
            <div class="role-modal-card">
              <div class="logo-badge">🌸</div>
              <h2>LioraShop</h2>
              <p class="subtitle">Ласкаво просимо! Оберіть режим перегляду для демонстрації:</p>
              <div class="role-options-grid">
                <div class="role-card-btn" id="modal-btn-guest">
                  <div class="role-card-icon">🛍️</div>
                  <h3>Я Користувач</h3>
                  <p>Переглянути ніжний промо-лендінг, переваги натурального догляду та перейти до покупок у Django.</p>
                  <span class="btn btn-primary btn-sm" style="margin-top: auto; width: 100%;">Увійти як клієнт →</span>
                </div>
                <div class="role-card-btn" id="modal-btn-admin">
                  <div class="role-card-icon">⚙️</div>
                  <h3>Я Адміністратор</h3>
                  <p>Перейти до адмін-панелі Payload CMS для керування контентом та базою Neon PostgreSQL.</p>
                  <span class="btn btn-outline btn-sm" style="margin-top: auto; width: 100%;">Відкрити адмінку CMS 🔐</span>
                </div>
              </div>
              <div class="role-modal-footer">
                💡 Проєкт практики: Fullstack-застосунок на Payload CMS, TypeScript та Neon PostgreSQL
              </div>
            </div>
          </div>
        `;

        document.getElementById('modal-btn-guest').addEventListener('click', () => {
          modalContainer.innerHTML = '';
          renderFloatingPill('guest');
          renderApp();
        });

        document.getElementById('modal-btn-admin').addEventListener('click', () => {
          modalContainer.innerHTML = '';
          renderFloatingPill('admin');
          renderApp();
          alert('Адмін-панель Payload CMS знаходиться за адресою: http://localhost:3000/admin\n\nДля запуску CMS виконайте: npm run dev:cms');
        });
      }

      function renderFloatingPill(role) {
        let pill = document.getElementById('role-floating-pill');
        if (!pill) {
          pill = document.createElement('div');
          pill.id = 'role-floating-pill';
          pill.className = 'role-floating-pill';
          document.body.appendChild(pill);
        }
        pill.innerHTML = `
          <span>Роль: <strong>${role === 'admin' ? '⚙️ Адміністратор' : '🌸 Клієнт'}</strong></span>
          <button id="btn-switch-role">Змінити</button>
          <a href="http://localhost:3000/admin" target="_blank" style="font-size: 0.75rem; text-decoration: underline; color: var(--color-sage-dark);">CMS ↗</a>
        `;
        document.getElementById('btn-switch-role').addEventListener('click', showRoleModal);
      }

      window.addEventListener('DOMContentLoaded', () => {
        showRoleModal();
      });
    </script>
  </body>
</html>
